<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGI RECORDS | Demók</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0a0a0c; color: #f5f5f7; padding-top: 120px; }
        .navbar { background-color: rgba(10, 10, 12, 0.95); border-bottom: 1px solid rgba(0, 210, 255, 0.1); }
        .nav-link { color: #a0a0aa !important; }
        .nav-link:hover, .nav-link.active { color: #00d2ff !important; }
        .form-container { background-color: #121318; border: 1px solid rgba(0, 210, 255, 0.1); }
        .form-control { background-color: #0a0a0c !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
        .form-control:focus { border-color: #00d2ff !important; box-shadow: 0 0 0 0.25rem rgba(0, 210, 255, 0.25) !important; }
        .btn-custom { background: linear-gradient(45deg, #0066ff, #00d2ff); color: white; border: none; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MAGI<span style="color:#00d2ff;">RECORDS</span></a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Kezdőlap</a></li>
                    <li class="nav-item"><a class="nav-link" href="eloadok.html">Előadóink</a></li>
                    <li class="nav-item"><a class="nav-link" href="archivum.html">Archívum</a></li>
                    <li class="nav-item"><a class="nav-link" href="studiok.html">Stúdiók</a></li>
                    <li class="nav-item"><a class="nav-link active" href="demok.html">Demók</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <h2 class="border-start border-4 border-info ps-3 mb-5 fw-bold text-uppercase">Demo Beküldés</h2>
                
                <div class="form-container p-4 p-md-5 rounded-3">
                    <form id="demoForm" onsubmit="handleDemoSubmit(event)">
                        <div class="mb-3">
                            <label for="artistName" class="form-label small text-secondary fw-bold">Művésznév / Zenekar *</label>
                            <input type="text" class="form-control form-control-lg" id="artistName" required placeholder="Pl. DJ Péter">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label small text-secondary fw-bold">E-mail cím *</label>
                            <input type="email" class="form-control form-control-lg" id="email" required placeholder="pelda@email.hu">
                        </div>
                        <div class="mb-3">
                            <label for="demoLink" class="form-label small text-secondary fw-bold">SoundCloud / Drive Link *</label>
                            <input type="url" class="form-control form-control-lg" id="demoLink" required placeholder="https://soundcloud.com/...">
                        </div>
                        <div class="mb-4">
                            <label for="message" class="form-label small text-secondary fw-bold">Rövid bemutatkozás</label>
                            <textarea class="form-control" id="message" rows="4" placeholder="Írj pár szót magadról, vagy a stílusodról..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-custom btn-lg w-100 fw-bold py-3">Demo Elküldése</button>
                    </form>

                    <div id="successMessage" class="text-center d-none py-4">
                        <span class="display-4 d-block mb-3">🎉</span>
                        <h4 class="fw-bold text-info mb-2">Sikeres küldés!</h4>
                        <p class="text-secondary mb-0">A demódat rögzítettük. Hamarosan meghallgatjuk és jelentkezünk!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleDemoSubmit(event) {
            event.preventDefault(); // Megakadályozza az oldal újratöltését

            const name = document.getElementById('artistName').value;
            const email = document.getElementById('email').value;
            const link = document.getElementById('demoLink').value;

            if(name && email && link) {
                // Elrejtjük az űrlapot
                document.getElementById('demoForm').classList.add('d-none');
                // Megjelenítjük a sikeres üzenetet (Bootstrap d-none osztály eltávolításával)
                document.getElementById('successMessage').classList.remove('d-none');
                
                console.log("Demo elmentve:", { name, email, link });
            }
        }
    </script>
</body>
</html>
